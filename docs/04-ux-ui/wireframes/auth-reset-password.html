<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Set your password</title>
<link rel="stylesheet" href="../tokens.css"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="hero-bg" style="min-height:100vh;">
<header class="app-header" style="background:transparent;border:none;"><a href="index.html" class="text-lg font-bold gradient-text-brand">INFLU.ai</a></header>
<main id="main" role="main" style="max-width:440px;margin:0 auto;padding:3rem var(--space-6);">
  <div class="glass-card" style="padding:2.5rem 2rem;">
    <h1 class="gradient-text" style="font-size:var(--text-h1);font-weight:700;text-align:center;margin-bottom:0.5rem;">Set your password</h1>
    <p style="color:var(--text-secondary);text-align:center;font-size:var(--text-small);margin-bottom:1.5rem;">Choose a strong password (min 8 characters).</p>
    <form style="display:flex;flex-direction:column;gap:1rem;">
      <div><label class="label label-required" for="pwd">New password</label><input id="pwd" type="password" required minlength="8" class="input"></div>
      <div><label class="label label-required" for="pwd2">Confirm password</label><input id="pwd2" type="password" required minlength="8" class="input"></div>
      <button class="btn btn-primary" type="submit">Change password</button>
    </form>
    <div class="alert alert-warning" style="margin-top:1.25rem;font-size:var(--text-xs);"><span>⏱</span><div>Link expires after 24h. <a href="auth-forgot-password.html">Request a new one</a> if expired.</div></div>
  </div>
</main></body></html>
