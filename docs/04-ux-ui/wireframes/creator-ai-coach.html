<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mon AI Coach</title>
<link rel="stylesheet" href="../tokens.css"><script src="https://cdn.tailwindcss.com"></script></head>
<body>
<header class="app-header"><a href="creator-dashboard.html" class="text-lg font-bold gradient-text-brand">INFLU.ai</a><span class="avatar avatar-sm">A</span></header>
<div style="display:flex;">
<aside class="app-sidebar">
<div class="sidebar-section"><a href="creator-dashboard.html" class="sidebar-item">📊 Dashboard</a></div>
<div class="sidebar-section"><div class="sidebar-title">Opportunities</div><a href="creator-marketplace-list.html" class="sidebar-item">🛍 Marketplace</a></div>
<div class="sidebar-section"><div class="sidebar-title">Assets</div><a href="creator-my-account.html" class="sidebar-item">👤 My Account</a><a href="creator-ai-coach.html" class="sidebar-item active">🤖 My AI coach</a></div>
<div class="sidebar-section"><a href="creator-messaging.html" class="sidebar-item">💬 Messaging</a></div>
<div class="sidebar-section"><a href="creator-support.html" class="sidebar-item">❓ Support</a></div>
</aside>

<main id="main" role="main" style="flex:1;padding:var(--space-8);max-width:900px;display:flex;flex-direction:column;height:calc(100vh - 64px);">
  <!-- Header -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
    <div style="display:flex;align-items:center;gap:0.75rem;"><span class="avatar">A</span><div><h1 style="font-size:var(--text-h2);font-weight:700;">My AI coach</h1><p style="color:var(--text-muted);font-size:var(--text-xs);">Conversation personnalisée pour Ali</p></div></div>
    <button class="btn btn-ghost btn-sm">↻ Restart</button>
  </div>

  <!-- Conversation -->
  <div role="log" aria-live="polite" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1rem;padding:1rem 0;">
    <div class="chat-bubble chat-bubble-ai">
      <span class="avatar avatar-sm" style="background:var(--gradient-primary);color:#fff;">🤖</span>
      <div><strong style="font-size:var(--text-xs);color:var(--text-muted);display:block;margin-bottom:0.25rem;">Assistant Message</strong>Comment te positionnes-tu en tant qu'influenceur ?</div>
    </div>
  </div>

  <!-- Input -->
  <form style="display:flex;gap:0.75rem;align-items:flex-end;border-top:1px solid var(--border-subtle);padding-top:1rem;">
    <textarea class="textarea" rows="2" placeholder="Tape ta réponse…" aria-label="Your message" style="resize:none;"></textarea>
    <button type="submit" class="btn btn-primary" aria-disabled="true" disabled aria-describedby="send-disabled-reason" aria-label="Send">
      ✈
    </button>
  </form>
  <p id="send-disabled-reason" class="help-text">Tape un message pour envoyer.</p>
</main></div></body></html>
