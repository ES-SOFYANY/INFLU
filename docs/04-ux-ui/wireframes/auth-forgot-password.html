<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forgot your password?</title>
<link rel="stylesheet" href="../tokens.css"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="hero-bg" style="min-height:100vh;">
<header class="app-header" style="background:transparent;border:none;"><a href="index.html" class="text-lg font-bold gradient-text-brand">INFLU.ai</a></header>
<main id="main" role="main" style="max-width:440px;margin:0 auto;padding:3rem var(--space-6);">
  <div class="glass-card" style="padding:2.5rem 2rem;">
    <h1 class="gradient-text" style="font-size:var(--text-h1);font-weight:700;text-align:center;margin-bottom:0.5rem;">Forgot your password?</h1>
    <p style="color:var(--text-secondary);text-align:center;font-size:var(--text-small);margin-bottom:1.5rem;">Enter your email and we'll send a reset link.</p>
    <form style="display:flex;flex-direction:column;gap:1rem;">
      <div><label class="label label-required" for="email">Email</label><input id="email" type="email" required class="input"></div>
      <button class="btn btn-primary" type="submit">Send reset link</button>
    </form>
    <p style="text-align:center;margin-top:1.5rem;font-size:var(--text-small);"><a href="auth-login.html">← Back to sign in</a></p>
  </div>
</main></body></html>
