<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>New AI Campaign</title>
<link rel="stylesheet" href="../tokens.css"><script src="https://cdn.tailwindcss.com"></script></head>
<body>
<header class="app-header"><a href="business-dashboard.html" class="text-lg font-bold gradient-text-brand">INFLU.ai</a><span class="avatar avatar-sm">B</span></header>
<div style="display:flex;">
<aside class="app-sidebar">
<div class="sidebar-section"><a href="business-dashboard.html" class="sidebar-item">📊 Dashboard</a></div>
<div class="sidebar-section"><div class="sidebar-title">INFLU AI</div><a href="business-ai-campaign.html" class="sidebar-item active">✨ New AI Campaign</a><a href="business-ai-manager.html" class="sidebar-item">🤖 AI Manager</a></div>
<div class="sidebar-section"><a href="business-discovery.html" class="sidebar-item">🔍 Discovery</a><a href="business-crm.html" class="sidebar-item">📇 CRM</a></div>
<div class="sidebar-section"><a href="business-messaging.html" class="sidebar-item">💬 Messaging</a><a href="business-payments.html" class="sidebar-item">💰 Payments</a></div>
<div class="sidebar-section"><a href="business-support.html" class="sidebar-item">❓ Support</a></div>
</aside>

<main id="main" role="main" style="flex:1;padding:var(--space-8);max-width:880px;display:flex;flex-direction:column;height:calc(100vh - 64px);">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
    <div><h1 style="font-size:var(--text-h1);font-weight:700;">New AI Campaign</h1><p style="color:var(--text-muted);font-size:var(--text-xs);">Step 1 of 9 — let's define your campaign</p></div>
    <button class="btn btn-ghost btn-sm">↻ Restart</button>
  </div>

  <div role="log" aria-live="polite" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1rem;padding:1rem 0;">
    <div class="chat-bubble chat-bubble-ai">
      <span class="avatar avatar-sm" style="background:var(--gradient-primary);color:#fff;">🤖</span>
      <div>
        <strong style="font-size:var(--text-xs);color:var(--text-muted);display:block;margin-bottom:0.25rem;">INFLU AI</strong>
        <p style="margin-bottom:1rem;">What kind of campaign would you like to launch, and what scope are you aiming for?</p>
        <div style="display:flex;flex-direction:column;gap:0.5rem;">
          <label style="display:flex;gap:0.625rem;align-items:center;font-size:var(--text-small);padding:0.625rem 0.875rem;background:var(--bg-overlay);border-radius:8px;cursor:pointer;border:1px solid var(--border-subtle);"><input type="checkbox"> Branding</label>
          <label style="display:flex;gap:0.625rem;align-items:center;font-size:var(--text-small);padding:0.625rem 0.875rem;background:var(--bg-overlay);border-radius:8px;cursor:pointer;border:1px solid var(--border-subtle);"><input type="checkbox"> Visibility / Awareness</label>
          <label style="display:flex;gap:0.625rem;align-items:center;font-size:var(--text-small);padding:0.625rem 0.875rem;background:var(--bg-overlay);border-radius:8px;cursor:pointer;border:1px solid var(--border-subtle);"><input type="checkbox"> Positioning / Storytelling</label>
          <label style="display:flex;gap:0.625rem;align-items:center;font-size:var(--text-small);padding:0.625rem 0.875rem;background:var(--bg-overlay);border-radius:8px;cursor:pointer;border:1px solid var(--border-subtle);"><input type="checkbox"> New Product Or Service Launch</label>
          <label style="display:flex;gap:0.625rem;align-items:center;font-size:var(--text-small);padding:0.625rem 0.875rem;background:var(--bg-overlay);border-radius:8px;cursor:pointer;border:1px solid var(--border-subtle);"><input type="checkbox"> Promotions (Flash Sales, etc.)</label>
          <label style="display:flex;gap:0.625rem;align-items:center;font-size:var(--text-small);padding:0.625rem 0.875rem;background:var(--bg-overlay);border-radius:8px;cursor:pointer;border:1px solid var(--border-subtle);"><input type="checkbox"> Event Promotion</label>
          <label style="display:flex;gap:0.625rem;align-items:center;font-size:var(--text-small);padding:0.625rem 0.875rem;background:var(--bg-overlay);border-radius:8px;cursor:pointer;border:1px solid var(--border-subtle);"><input type="checkbox"> Engagement &amp; Interactions</label>
        </div>
      </div>
    </div>
  </div>

  <form style="display:flex;gap:0.75rem;align-items:flex-end;border-top:1px solid var(--border-subtle);padding-top:1rem;">
    <textarea class="textarea" rows="2" placeholder="Add details or skip with Send…" aria-label="Your message" style="resize:none;"></textarea>
    <button type="submit" class="btn btn-primary" aria-disabled="true" disabled aria-label="Send">✈</button>
  </form>
</main></div></body></html>
