<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Welcome back to INFLU!</title>
<link rel="stylesheet" href="../tokens.css"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="hero-bg" style="min-height:100vh;">
<header class="app-header" style="background:transparent;border:none;"><a href="index.html" class="text-lg font-bold gradient-text-brand">INFLU.ai</a></header>
<main id="main" role="main" style="max-width:440px;margin:0 auto;padding:3rem var(--space-6);">
  <div class="glass-card" style="padding:2.5rem 2rem;">
    <h1 class="gradient-text" style="font-size:var(--text-h1);font-weight:700;text-align:center;margin-bottom:0.5rem;">Welcome back to INFLU!</h1>
    <p style="color:var(--text-secondary);text-align:center;font-size:var(--text-small);margin-bottom:2rem;">Sign in to continue.</p>

    <form style="display:flex;flex-direction:column;gap:1rem;">
      <div>
        <label class="label label-required" for="email">Email</label>
        <input id="email" name="email" type="email" required class="input" placeholder="you@example.com">
      </div>
      <div>
        <label class="label label-required" for="password">Password</label>
        <div style="position:relative;">
          <input id="password" name="password" type="password" required class="input" placeholder="••••••••" style="padding-inline-end:2.75rem;">
          <button type="button" aria-label="Show password" style="position:absolute;inset-inline-end:0.5rem;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:0.5rem;">👁</button>
        </div>
        <div style="margin-top:0.5rem;text-align:end;"><a href="auth-forgot-password.html" style="font-size:var(--text-xs);">Forgot your password?</a></div>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">Sign In</button>
    </form>

    <div style="display:flex;align-items:center;gap:0.75rem;margin:1.25rem 0;color:var(--text-muted);font-size:var(--text-xs);">
      <hr style="flex:1;border:none;border-top:1px solid var(--border-subtle);">OR<hr style="flex:1;border:none;border-top:1px solid var(--border-subtle);">
    </div>

    <button class="btn btn-secondary" style="width:100%;">
      <span aria-hidden="true">G</span> Continue with Google
    </button>

    <p style="text-align:center;margin-top:1.5rem;font-size:var(--text-small);color:var(--text-secondary);">New to INFLU? <a href="auth-register-roles.html">Create an account</a></p>
    <p style="text-align:center;margin-top:1rem;font-size:var(--text-xs);color:var(--text-muted);">By clicking continue, you agree to our <a href="legal-brand.html">legal mentions</a> and <a href="legal-privacy.html">privacy policy</a>.</p>
  </div>
</main>
</body></html>
