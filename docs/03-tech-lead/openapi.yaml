        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ========= NOTIFICATIONS =========
  /notifications:
    get:
      tags: [Notifications]
      summary: List my notifications
      parameters:
        - in: query
          name: unreadOnly
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedNotifications' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      responses:
        '204': { description: Marked as read }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ========= SUPPORT =========
  /support/faq:
    get:
      tags: [Support]
      summary: Get FAQ entries (public)
      security: []
      parameters:
        - in: query
          name: locale
          schema: { type: string, enum: [fr, en, ar] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FaqEntry' }
        '500': { $ref: '#/components/responses/InternalError' }

  /support/reports:
    get:
      tags: [Support]
      summary: List my support reports
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedReports' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Support]
      summary: Submit a support report
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReportRequest' }
      responses:
        '201':
          description: Report submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    PlatformPath:
      in: path
      name: platform
      required: true
      schema: { $ref: '#/components/schemas/Platform' }
    RegisterRolePath:
      in: path
      name: role
      required: true
      schema:
        type: string
        enum: [influencer, business, agency, brand]
    Cursor:
      in: query
      name: cursor
      schema: { type: string }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, description: 'ULID' }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing/invalid/expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but insufficient role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Business rule conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Business validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ----- Common -----
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          description: Stable SCREAMING_SNAKE_CASE error code
          example: PROFILE_INCOMPLETE
        message:
          type: string
          example: 'Cannot apply: missing required documents'
        details:
          type: object
          additionalProperties: true
        traceId:
          type: string
          example: 01JABCXYZDEF456GHJ789

    # ----- Enums -----
    Role:
      type: string
      enum: [CREATOR, BUSINESS, AGENCY, ADMIN]
    Platform:
      type: string
      enum: [INSTAGRAM, YOUTUBE, TIKTOK, TWITTER, FACEBOOK, LINKEDIN]
    ContentFormat:
      type: string
      enum: [POST, REEL, STORY, VIDEO, SHORT, LIVE, CAROUSEL]
    Tier:
      type: string
      enum: [NANO, MICRO, MID, MACRO, MEGA, CELEBRITY]
    CampaignStatus:
      type: string
      enum: [DRAFT, SCHEDULED, ACTIVE, PAUSED, COMPLETED, ARCHIVED, CANCELLED]
    PaymentStatus:
      type: string
      enum: [PENDING, SCHEDULED, PROCESSING, COMPLETED, FAILED]
    CinStatus:
      type: string
      enum: [NONE, PENDING, VALIDATED, REJECTED]
    IssueType:
      type: string
      enum: [BUG, FEATURE_REQUEST, PERFORMANCE, UI_ISSUE, CAMPAIGN_ISSUE, OTHER]
    BillingProfile:
      type: string
      enum: [BUSINESS, AUTO_ENTREPRENEUR]
    Currency:
      type: string
      enum: [MAD]
    Money:
      type: object
      required: [value, currency]
      properties:
        value: { type: number, minimum: 0 }
        currency: { $ref: '#/components/schemas/Currency' }

    # ----- Auth -----
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: 'Access token TTL in seconds' }
    UserPublic:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        fullName: { type: string }
        locale: { type: string, enum: [fr, en, ar] }
        orgId: { type: string, format: uuid, nullable: true }
    AuthSession:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/UserPublic' }
        tokens: { $ref: '#/components/schemas/AuthTokens' }
    RegisterCreatorRequest:
      type: object
      required: [email, fullName, gender, country, phone, city, acceptLegal, ageOver18]
      properties:
        email: { type: string, format: email }
        fullName: { type: string, minLength: 2 }
        gender: { type: string, enum: [M, F] }
        country: { type: string, minLength: 2, maxLength: 2 }
        phone: { type: string, pattern: '^\+212\d{9}$' }
        city: { type: string }
        address: { type: string }
        acceptLegal: { type: boolean, enum: [true] }
        ageOver18: { type: boolean, enum: [true] }
        locale: { type: string, enum: [fr, en, ar] }
    RegisterBusinessRequest:
      type: object
      required: [email, password, companyName, fullName, phone]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        companyName: { type: string }
        fullName: { type: string }
        phone: { type: string, pattern: '^\+212\d{9}$' }
        locale: { type: string, enum: [fr, en, ar] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    GoogleCallbackRequest:
      type: object
      required: [code, state]
      properties:
        code: { type: string }
        state: { type: string }
        codeVerifier: { type: string }
    EmailLocaleRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        locale: { type: string, enum: [fr, en, ar] }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    MagicLinkConsumeResponse:
      type: object
      required: [resetSession, userId]
      properties:
        resetSession: { type: string }
        userId: { type: string, format: uuid }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 10 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    OnboardBusinessRequest:
      type: object
      required: [juridicalForm, ice, companyName, companyAddress, if, rc, tva]
      properties:
        juridicalForm: { type: string }
        ice: { type: string, pattern: '^\d{15}$' }
        companyName: { type: string }
        companyAddress: { type: string }
        if: { type: string, pattern: '^\d{7,9}$' }
        rc: { type: string, pattern: '^\d+$' }
        tva: { type: string, pattern: '^\d+$' }

    # ----- Creator -----
    CreatorProfile:
      type: object
      required: [id, email, fullName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        gender: { type: string, enum: [M, F] }
        country: { type: string }
        city: { type: string }
        address: { type: string }
        phone: { type: string }
        bio: { type: string }
        category: { type: string }
        locale: { type: string, enum: [fr, en, ar] }
        avatarUrl: { type: string, format: uri }
        cinStatus: { $ref: '#/components/schemas/CinStatus' }
    UpdateCreatorProfileRequest:
      type: object
      properties:
        fullName: { type: string }
        gender: { type: string, enum: [M, F] }
        country: { type: string }
        city: { type: string }
        address: { type: string }
        phone: { type: string }
        locale: { type: string, enum: [fr, en, ar] }
    CreatorProfileOverview:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        bio: { type: string }
        category: { type: string }
        avatarUrl: { type: string, format: uri }
        coverUrl: { type: string, format: uri }
        tier: { $ref: '#/components/schemas/Tier' }
    UpdateCreatorProfileOverviewRequest:
      type: object
      properties:
        bio: { type: string, maxLength: 500 }
        category: { type: string }
        avatarUrl: { type: string, format: uri }
        coverUrl: { type: string, format: uri }
    SocialAccount:
      type: object
      required: [id, platform, handle]
      properties:
        id: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/Platform' }
        handle: { type: string }
        followers: { type: integer }
        engagementRate: { type: number, format: float }
        tier: { $ref: '#/components/schemas/Tier' }
        linkedAt: { type: string, format: date-time }
    OAuthAuthorizeResponse:
      type: object
      required: [url, state]
      properties:
        url: { type: string, format: uri }
        state: { type: string }
    CreatorDashboardKpis:
      type: object
      properties:
        totalFollowers: { type: integer }
        avgEngagementRate: { type: number }
        activeCollaborations: { type: integer }
        pendingApplications: { type: integer }
        completedDeliverables: { type: integer }
        revenueMad: { $ref: '#/components/schemas/Money' }
        pendingRevenueMad: { $ref: '#/components/schemas/Money' }
        unreadMessages: { type: integer }
        unreadNotifications: { type: integer }
        profileCompletion: { type: integer, minimum: 0, maximum: 100 }
    SignedUrlResponse:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    SignedUploadUrlResponse:
      allOf:
        - $ref: '#/components/schemas/SignedUrlResponse'
        - type: object
          required: [s3Key]
          properties:
            s3Key: { type: string }

    # ----- Business / Brand -----
    BusinessProfile:
      type: object
      required: [id, email, companyName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: string }
        address: { type: string }
        companyName: { type: string }
        juridicalForm: { type: string }
        ice: { type: string }
        if: { type: string }
        rc: { type: string }
        tva: { type: string }
        onboarded: { type: boolean }
        locale: { type: string, enum: [fr, en, ar] }
    UpdateBusinessProfileRequest:
      type: object
      properties:
        fullName: { type: string }
        phone: { type: string }
        address: { type: string }
        locale: { type: string, enum: [fr, en, ar] }
    BusinessDashboardKpis:
      type: object
      properties:
        activeCampaigns: { type: integer }
        publishedProducts: { type: integer }
        pendingApplications: { type: integer }
        validatedDeliverables: { type: integer }
        totalSpentMad: { $ref: '#/components/schemas/Money' }
        scheduledPaymentsMad: { $ref: '#/components/schemas/Money' }
        unreadMessages: { type: integer }
        unreadNotifications: { type: integer }
    Brand:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        logoUrl: { type: string, format: uri }
        category: { type: string }
        ice: { type: string }
        verified: { type: boolean }
    BrandSearchHit:
      allOf:
        - $ref: '#/components/schemas/Brand'
        - type: object
          properties:
            socialHandle: { type: string }
            alreadyLinked: { type: boolean }
    LinkBrandRequest:
      type: object
      required: [brandId]
      properties:
        brandId: { type: string, format: uuid }
    BrandAccess:
      type: object
      required: [memberId, email, role]
      properties:
        memberId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [VIEWER, EDITOR, ADMIN] }
        invitedAt: { type: string, format: date-time }
    GrantBrandAccessRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [VIEWER, EDITOR, ADMIN] }

    # ----- Admin Validation / Documents -----
    CinDocument:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/CinStatus' }
        cinNumber: { type: string }
        expiry: { type: string, format: date }
        rectoUrl: { type: string, format: uri }
        versoUrl: { type: string, format: uri }
        submittedAt: { type: string, format: date-time }
        validatedAt: { type: string, format: date-time }
        rejectionReason: { type: string }
    SubmitCinRequest:
      type: object
      required: [cinNumber, expiry, rectoS3Key, versoS3Key]
      properties:
        cinNumber: { type: string, pattern: '^[A-Za-z]{1,2}\d{5,6}$' }
        expiry: { type: string, format: date }
        rectoS3Key: { type: string }
        versoS3Key: { type: string }
    UploadUrlRequest:
      type: object
      required: [filename, contentType, size]
      properties:
        filename: { type: string }
        contentType:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        size: { type: integer, minimum: 1, maximum: 10485760 }
    IceSearchRequest:
      type: object
      required: [q]
      properties:
        q: { type: string, minLength: 3 }
    IceSearchResult:
      type: object
      required: [ice, companyName]
      properties:
        ice: { type: string }
        companyName: { type: string }
        address: { type: string }
        if: { type: string }
        rc: { type: string }
        tva: { type: string }
    IceApproveRequest:
      type: object
      required: [ice, billingProfile]
      properties:
        ice: { type: string, pattern: '^\d{15}$' }
        billingProfile: { $ref: '#/components/schemas/BillingProfile' }
    CreatorBilling:
      type: object
      properties:
        billingProfile: { $ref: '#/components/schemas/BillingProfile' }
        ice: { type: string }
        companyName: { type: string }
        address: { type: string }
        if: { type: string }
        rc: { type: string }
        tva: { type: string }
        rib: { type: string, pattern: '^\d{24}$' }
        approved: { type: boolean }
    PricingRow:
      type: object
      required: [accountId, platform, contentFormat, rateFromMad, rateToMad]
      properties:
        accountId: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/Platform' }
        contentFormat: { $ref: '#/components/schemas/ContentFormat' }
        rateFromMad: { type: number, minimum: 0 }
        rateToMad: { type: number, minimum: 0 }
    UpdatePricingRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/PricingRow' }
    CinSubmission:
      type: object
      required: [userId, status, submittedAt]
      properties:
        userId: { type: string, format: uuid }
        userFullName: { type: string }
        cinNumber: { type: string }
        expiry: { type: string, format: date }
        rectoUrl: { type: string, format: uri }
        versoUrl: { type: string, format: uri }
        status: { $ref: '#/components/schemas/CinStatus' }
        submittedAt: { type: string, format: date-time }
    RejectReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5 }

    # ----- Marketplace -----
    Deliverable:
      type: object
      required: [platform, contentType, quantity, unitPriceMad, taggedAccount, tier]
      properties:
        id: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/Platform' }
        contentType: { $ref: '#/components/schemas/ContentFormat' }
        quantity: { type: integer, minimum: 1 }
        unitPriceMad: { type: number, minimum: 0 }
        taggedAccount: { type: string, pattern: '^@[a-zA-Z0-9._]{2,30}$' }
        tier: { $ref: '#/components/schemas/Tier' }
        receptionDate: { type: string, format: date }
        publicationDate: { type: string, format: date }
    MarketplaceProductCard:
      type: object
      required: [id, productName, brandId, status]
      properties:
        id: { type: string, format: uuid }
        productName: { type: string }
        brandId: { type: string, format: uuid }
        brandName: { type: string }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        slotsLeft: { type: integer }
        slotsTotal: { type: integer }
        publishedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        thumbnailUrl: { type: string, format: uri }
        budgetMad: { $ref: '#/components/schemas/Money' }
    MarketplaceProductDetail:
      allOf:
        - $ref: '#/components/schemas/MarketplaceProductCard'
        - type: object
          properties:
            brandDescription: { type: string }
            productDescription: { type: string }
            requestedContent: { type: string }
            miniScript: { type: string }
            acceptanceCriteria:
              type: array
              items: { type: string }
            deliverables:
              type: array
              items: { $ref: '#/components/schemas/Deliverable' }
            hashtags:
              type: array
              items: { type: string }
            callToAction: { type: string }
            wizardStep: { type: string, enum: [A, B, C, D, E, PUBLISHED] }
    WizardStepARequest:
      type: object
      required: [brandId, brandDescription]
      properties:
        brandId: { type: string, format: uuid }
        brandDescription: { type: string, minLength: 10 }
    WizardStepBRequest:
      type: object
      required: [productName, productDescription, requestedContent, miniScript]
      properties:
        productName: { type: string }
        productDescription: { type: string }
        requestedContent: { type: string }
        miniScript: { type: string }
    WizardStepCRequest:
      type: object
      required: [acceptanceCriteria]
      properties:
        acceptanceCriteria:
          type: array
          minItems: 1
          items: { type: string }
    WizardStepDRequest:
      type: object
      required: [deliverables, hashtags, callToAction]
      properties:
        deliverables:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Deliverable' }
        hashtags:
          type: array
          items: { type: string }
        callToAction: { type: string }
    WizardStepERequest:
      type: object
      required: [datesByDeliverable]
      properties:
        datesByDeliverable:
          type: array
          items:
            type: object
            required: [deliverableId, receptionDate, publicationDate]
            properties:
              deliverableId: { type: string, format: uuid }
              receptionDate: { type: string, format: date }
              publicationDate: { type: string, format: date }
    WizardStepRequest:
      type: object
      required: [step, payload]
      properties:
        step: { type: string, enum: [A, B, C, D, E] }
        payload:
          oneOf:
            - $ref: '#/components/schemas/WizardStepARequest'
            - $ref: '#/components/schemas/WizardStepBRequest'
            - $ref: '#/components/schemas/WizardStepCRequest'
            - $ref: '#/components/schemas/WizardStepDRequest'
            - $ref: '#/components/schemas/WizardStepERequest'
    Application:
      type: object
      required: [id, productId, creatorId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        creatorId: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, CONTENT_SUBMITTED, MODIFICATION_REQUESTED, VALIDATED, COMPLETED, CANCELLED]
        createdAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time }
        amountMad: { $ref: '#/components/schemas/Money' }

    # ----- AI Campaign / Coach -----
    AiCampaign:
      type: object
      required: [id, scope, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        scope:
          type: array
          items:
            type: string
            enum: [BRANDING, VISIBILITY_AWARENESS, POSITIONING_STORYTELLING, NEW_PRODUCT_LAUNCH, PROMOTIONS, EVENT_PROMOTION, ENGAGEMENT_INTERACTIONS]
        status: { $ref: '#/components/schemas/CampaignStatus' }
        briefReady: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StartAiCampaignRequest:
      type: object
      required: [scope]
      properties:
        scope:
          type: array
          minItems: 1
          items:
            type: string
            enum: [BRANDING, VISIBILITY_AWARENESS, POSITIONING_STORYTELLING, NEW_PRODUCT_LAUNCH, PROMOTIONS, EVENT_PROMOTION, ENGAGEMENT_INTERACTIONS]
    UpdateCampaignStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/CampaignStatus' }
    ChatMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }
    AiCoachSession:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    # ----- Discovery -----
    PublicCreatorProfile:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        bio: { type: string }
        category: { type: string }
        country: { type: string }
        city: { type: string }
        avatarUrl: { type: string, format: uri }
        coverUrl: { type: string, format: uri }
        tier: { $ref: '#/components/schemas/Tier' }
        socialAccounts:
          type: array
          items: { $ref: '#/components/schemas/SocialAccount' }

    # ----- CRM -----
    CrmList:
      type: object
      required: [id, title, description, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
    CrmListDetail:
      allOf:
        - $ref: '#/components/schemas/CrmList'
        - type: object
          properties:
            members:
              type: array
              items: { $ref: '#/components/schemas/CrmMember' }
    CrmMember:
      type: object
      required: [creatorId, addedAt]
      properties:
        creatorId: { type: string, format: uuid }
        fullName: { type: string }
        avatarUrl: { type: string, format: uri }
        tier: { $ref: '#/components/schemas/Tier' }
        addedAt: { type: string, format: date-time }
    CreateCrmListRequest:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 500 }

    # ----- Messaging -----
    Conversation:
      type: object
      required: [id, participantIds, lastMessageAt]
      properties:
        id: { type: string, format: uuid }
        participantIds:
          type: array
          items: { type: string, format: uuid }
        lastMessageAt: { type: string, format: date-time }
        lastMessagePreview: { type: string }
        unreadCount: { type: integer }
        brandId: { type: string, format: uuid, nullable: true }
        productId: { type: string, format: uuid, nullable: true }
    Message:
      type: object
      required: [id, conversationId, authorId, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
    PostMessageRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }

    # ----- Payments -----
    Payment:
      type: object
      required: [id, type, status, amount, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [marketplace, campaign] }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amount: { $ref: '#/components/schemas/Money' }
        brandId: { type: string, format: uuid, nullable: true }
        applicationId: { type: string, format: uuid, nullable: true }
        creatorId: { type: string, format: uuid, nullable: true }
        scheduledAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    # ----- Notifications -----
    Notification:
      type: object
      required: [id, type, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum:
            - APPLICATION_ACCEPTED
            - APPLICATION_REJECTED
            - BRIEF_RECEIVED
            - CONTENT_MODIFICATION_REQUESTED
            - DELIVERABLE_VALIDATED
            - PAYMENT_RECEIVED
            - MESSAGE_RECEIVED
            - CIN_VALIDATED
            - OPPORTUNITY_EXPIRING
            - AI_COACH_RECOMMENDATION
            - APPLICATION_RECEIVED
            - DELIVERABLE_SUBMITTED
            - PAYMENT_COMPLETED_OR_FAILED
            - NEW_BRAND_LINKED
        title: { type: string }
        body: { type: string }
        link: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true

    # ----- Support -----
    FaqEntry:
      type: object
      required: [id, question, answer]
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }
        locale: { type: string, enum: [fr, en, ar] }
    SupportReport:
      type: object
      required: [id, issueType, title, description, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        issueType: { $ref: '#/components/schemas/IssueType' }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        createdAt: { type: string, format: date-time }
    CreateReportRequest:
      type: object
      required: [issueType, title, description]
      properties:
        issueType: { $ref: '#/components/schemas/IssueType' }
        title: { type: string, minLength: 3 }
        description: { type: string, minLength: 10 }

    # ----- Pagination wrappers -----
    Paginated:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: string, nullable: true }
    PaginatedApplications:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Application' }
    PaginatedMarketplaceProducts:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/MarketplaceProductCard' }
    PaginatedAiCampaigns:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AiCampaign' }
    PaginatedCreators:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PublicCreatorProfile' }
    PaginatedConversations:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Conversation' }
    PaginatedMessages:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Message' }
    PaginatedPayments:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Payment' }
    PaginatedNotifications:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Notification' }
    PaginatedReports:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SupportReport' }
    PaginatedCinSubmissions:
      allOf:
        - $ref: '#/components/schemas/Paginated'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CinSubmission' }
