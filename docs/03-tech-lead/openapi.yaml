openapi: 3.1.0
info:
  title: INFLU.ai API
  version: 1.0.0
  description: |
    Contrat API figé entre Tech Lead et API Developer pour la plateforme INFLU.ai.
    Base path runtime: `/api/v1`.
    Toutes les erreurs suivent le schéma `Error` (`{code, message, details?, traceId}`).
  contact:
    name: INFLU.ai Tech Lead
    email: tech@influ.ai
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.influ.ai/api/v1
    description: Production
  - url: https://staging-api.influ.ai/api/v1
    description: Staging
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Auth
    description: Authentification, inscription, sessions, refresh, OAuth Google, magic link.
  - name: CreatorProfile
    description: Profil créateur, dashboard, social coverage, collaborations.
  - name: BusinessProfile
    description: Profil business / agency / brand, dashboard.
  - name: Brand
    description: Recherche, liaison et gestion des accès aux brands.
  - name: Marketplace
    description: Catalogue produits, candidatures créateurs, wizard 5 étapes côté business.
  - name: AICampaign
    description: Génération de campagnes assistée par IA (chat + brief).
  - name: AICoach
    description: Conseiller IA pour créateurs (chat streaming).
  - name: Discovery
    description: Recherche multi-critères de créateurs (URL-bookmarkable).
  - name: CRM
    description: Listes CRM créateurs côté business.
  - name: Messaging
    description: Conversations et messages (REST + WebSocket).
  - name: Payments
    description: Paiements marketplace et campagnes.
  - name: Notifications
    description: Notifications in-app (14 types).
  - name: Support
    description: FAQ et reports utilisateurs.
  - name: AdminValidation
    description: Validation administrative (CIN, paiements, brands).

security:
  - bearerAuth: []

paths:
  # ========= AUTH =========
  /auth/register/{role}:
    post:
      tags: [Auth]
      summary: Register a new user (CREATOR | BUSINESS | AGENCY | BRAND)
      security: []
      parameters:
        - $ref: '#/components/parameters/RegisterRolePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RegisterCreatorRequest'
                - $ref: '#/components/schemas/RegisterBusinessRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/google/callback:
    post:
      tags: [Auth]
      summary: Exchange Google OAuth code for INFLU tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleCallbackRequest' }
      responses:
        '200':
          description: Authenticated via Google
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/magic-link/request:
    post:
      tags: [Auth]
      summary: Request a magic link by email (idempotent)
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailLocaleRequest' }
      responses:
        '202': { description: 'Accepted, link sent if email exists' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/magic-link/consume:
    post:
      tags: [Auth]
      summary: Consume a magic link token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Token consumed; reset session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MagicLinkConsumeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailLocaleRequest' }
      responses:
        '202': { description: Accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Apply new password using reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate current session
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/onboard:
    post:
      tags: [Auth]
      summary: Complete business onboarding (juridical info)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardBusinessRequest' }
      responses:
        '200':
          description: Onboarding completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ========= CREATOR PROFILE =========
  /creator/me:
    get:
      tags: [CreatorProfile]
      summary: Get my creator profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [CreatorProfile]
      summary: Update my creator profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCreatorProfileRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [CreatorProfile]
      summary: Soft-delete my creator account
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /creator/me/profile-overview:
    get:
      tags: [CreatorProfile]
      summary: Get my profile overview (header + bio + categories)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorProfileOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [CreatorProfile]
      summary: Update my profile overview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCreatorProfileOverviewRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorProfileOverview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /creator/me/social-coverage:
    get:
      tags: [CreatorProfile]
      summary: List my linked social accounts + metrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SocialAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /creator/me/dashboard-kpis:
    get:
      tags: [CreatorProfile]
      summary: Get creator dashboard KPIs (10 cards)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorDashboardKpis' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /creator/me/creator-report:
    get:
      tags: [CreatorProfile]
      summary: Get signed URL of latest Creator Report PDF
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedUrlResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /creator/me/social-accounts/{platform}/link:
    post:
      tags: [CreatorProfile]
      summary: Link a social account (returns OAuth authorize URL)
      parameters:
        - $ref: '#/components/parameters/PlatformPath'
      responses:
        '200':
          description: OAuth authorize URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthAuthorizeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /creator/me/collaborations:
    get:
      tags: [CreatorProfile]
      summary: List my marketplace collaborations
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedApplications' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ========= BUSINESS PROFILE =========
  /business/me:
    get:
      tags: [BusinessProfile]
      summary: Get my business profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [BusinessProfile]
      summary: Update my business account info
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBusinessProfileRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [BusinessProfile]
      summary: Soft-delete my business account
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /business/me/dashboard-kpis:
    get:
      tags: [BusinessProfile]
      summary: Get business dashboard KPIs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDashboardKpis' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ========= BRAND =========
  /business/brands:
    get:
      tags: [Brand]
      summary: List brands linked to my org
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Brand' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /business/brands/search:
    get:
      tags: [Brand]
      summary: Search existing brands by name or social handle
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BrandSearchHit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /business/brands/link:
    post:
      tags: [Brand]
      summary: Link an existing brand to my org
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkBrandRequest' }
      responses:
        '201':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brand' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /business/brands/{id}/access:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Brand]
      summary: List members with access to a brand
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BrandAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Brand]
      summary: Grant brand access to a member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantBrandAccessRequest' }
      responses:
        '201':
          description: Access granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandAccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ========= ADMIN VALIDATION (Creator docs side) =========
  /creator/me/documents/cin:
    get:
      tags: [AdminValidation]
      summary: Get my CIN document status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CinDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [AdminValidation]
      summary: Submit my CIN (recto + verso s3Keys + metadata)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitCinRequest' }
      responses:
        '201':
          description: CIN submitted (status PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CinDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /creator/me/documents/cin/cancel:
    post:
      tags: [AdminValidation]
      summary: Cancel my pending CIN submission
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /creator/me/documents/rib/upload-url:
    post:
      tags: [AdminValidation]
      summary: Request signed S3 PUT URL for RIB upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadUrlRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedUploadUrlResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /creator/me/documents/tax-certificate/upload-url:
    post:
      tags: [AdminValidation]
      summary: Request signed S3 PUT URL for tax certificate upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadUrlRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedUploadUrlResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /creator/me/billing/ice/search:
    post:
      tags: [AdminValidation]
      summary: Lookup legal entity by ICE
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IceSearchRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IceSearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /creator/me/billing/ice/approve:
    post:
      tags: [AdminValidation]
      summary: Approve an ICE selection (persists creator billing entity)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IceApproveRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorBilling' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /creator/me/pricing:
    get:
      tags: [AdminValidation]
      summary: Get my pricing grid (account × content format)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PricingRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [AdminValidation]
      summary: Update my pricing grid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePricingRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PricingRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/validations/cin:
    get:
      tags: [AdminValidation]
      summary: List pending CIN submissions (admin)
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/CinStatus' }
        - $ref: '#/components/parameters/Cursor'
