name: Deploy dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-3' }}
  STAGE: dev
  STACK_NAME: influ-dev

jobs:
  deploy:
    name: Build + deploy (dev)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-monorepo

      - name: Build shared-types
        run: npm -w packages/shared-types run build

      - name: Build API (NestJS)
        run: npm -w apps/api run build

      - name: Package Lambda bundle
        run: bash scripts/deploy/package-lambda.sh

      - name: Build Web (Angular)
        run: npm -w apps/web run build -- --configuration=production

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-dev-${{ github.run_id }}

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build
        run: sam build --template infrastructure/sam/template.yaml

      - name: SAM deploy
        id: deploy
        run: |
          set -euo pipefail
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --s3-prefix "$STACK_NAME" \
            --parameter-overrides \
              "Stage=$STAGE" \
              JwtSecretArn="${{ secrets.JWT_SECRET_ARN_DEV }}" \
              AlertEmail="${{ vars.ALERT_EMAIL }}" \
              CorsAllowedOrigins="${{ vars.CORS_ALLOWED_ORIGINS_DEV || '*' }}" \
              LogRetentionDays=30

      - name: Read stack outputs
        id: outputs
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' > /tmp/outputs.json
          BUCKET=$(jq -r '.[] | select(.OutputKey=="WebBucketName") | .OutputValue' /tmp/outputs.json)
          DIST=$(jq -r '.[] | select(.OutputKey=="DistributionId") | .OutputValue' /tmp/outputs.json)
          API=$(jq -r '.[] | select(.OutputKey=="ApiUrl") | .OutputValue' /tmp/outputs.json)
          WEB=$(jq -r '.[] | select(.OutputKey=="WebUrl") | .OutputValue' /tmp/outputs.json)
          {
            echo "bucket=$BUCKET"
            echo "distribution=$DIST"
            echo "api_url=$API"
            echo "web_url=$WEB"
          } >> "$GITHUB_OUTPUT"

      - name: Sync web SPA to S3
        run: |
          set -euo pipefail
          DIST_DIR=$(find apps/web/dist -mindepth 2 -maxdepth 2 -type d -name browser | head -1)
          if [ -z "$DIST_DIR" ]; then DIST_DIR=$(find apps/web/dist -mindepth 1 -maxdepth 2 -type d | head -1); fi
          echo "Syncing $DIST_DIR → s3://${{ steps.outputs.outputs.bucket }}"
          aws s3 sync "$DIST_DIR" "s3://${{ steps.outputs.outputs.bucket }}" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude index.html --exclude "*.map"
          aws s3 cp "$DIST_DIR/index.html" "s3://${{ steps.outputs.outputs.bucket }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution }}" \
            --paths '/*'

      - name: Smoke test API
        run: |
          set -e
          URL="${{ steps.outputs.outputs.api_url }}/health"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Try $i → $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Smoke test failed: $URL"
          exit 1

      - name: Deployment summary
        run: |
          {
            echo "### ✅ Deploy dev"
            echo ""
            echo "- API: ${{ steps.outputs.outputs.api_url }}"
            echo "- Web: ${{ steps.outputs.outputs.web_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
