name: Deploy production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (tag or commit)
        required: true
        default: main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-3' }}
  STAGE: prod
  STACK_NAME: influ-prod

jobs:
  deploy:
    name: Build + deploy (prod)
    runs-on: ubuntu-latest
    # The `production` GitHub Environment must be configured with required reviewers
    # (Settings → Environments → production → "Required reviewers").
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-monorepo

      - name: Build shared-types
        run: npm -w packages/shared-types run build

      - name: Build API
        run: npm -w apps/api run build

      - name: Package Lambda bundle
        run: bash scripts/deploy/package-lambda.sh

      - name: Build Web
        run: npm -w apps/web run build -- --configuration=production

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-prod-${{ github.run_id }}

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build
        run: sam build --template infrastructure/sam/template.yaml

      - name: SAM deploy
        run: |
          set -euo pipefail
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --s3-prefix "$STACK_NAME" \
            --parameter-overrides \
              "Stage=$STAGE" \
              JwtSecretArn="${{ secrets.JWT_SECRET_ARN_PROD }}" \
              AlertEmail="${{ vars.ALERT_EMAIL }}" \
              CorsAllowedOrigins="${{ vars.CORS_ALLOWED_ORIGINS_PROD }}" \
              AcmCertificateArn="${{ vars.ACM_CERTIFICATE_ARN_PROD }}" \
              DomainName="${{ vars.DOMAIN_NAME_PROD }}" \
              LogRetentionDays=90

      - name: Read stack outputs
        id: outputs
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' > /tmp/outputs.json
          BUCKET=$(jq -r '.[] | select(.OutputKey=="WebBucketName") | .OutputValue' /tmp/outputs.json)
          DIST=$(jq -r '.[] | select(.OutputKey=="DistributionId") | .OutputValue' /tmp/outputs.json)
          API=$(jq -r '.[] | select(.OutputKey=="ApiUrl") | .OutputValue' /tmp/outputs.json)
          WEB=$(jq -r '.[] | select(.OutputKey=="WebUrl") | .OutputValue' /tmp/outputs.json)
          {
            echo "bucket=$BUCKET"
            echo "distribution=$DIST"
            echo "api_url=$API"
            echo "web_url=$WEB"
          } >> "$GITHUB_OUTPUT"

      - name: Sync web SPA to S3
        run: |
          set -euo pipefail
          DIST_DIR=$(find apps/web/dist -mindepth 2 -maxdepth 2 -type d -name browser | head -1)
          if [ -z "$DIST_DIR" ]; then DIST_DIR=$(find apps/web/dist -mindepth 1 -maxdepth 2 -type d | head -1); fi
          aws s3 sync "$DIST_DIR" "s3://${{ steps.outputs.outputs.bucket }}" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude index.html --exclude "*.map"
          aws s3 cp "$DIST_DIR/index.html" "s3://${{ steps.outputs.outputs.bucket }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution }}" --paths '/*'

      - name: Smoke test
        run: |
          set -e
          URL="${{ steps.outputs.outputs.api_url }}/health"
          for _ in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$URL" || true)
            [ "$CODE" = "200" ] && exit 0
            sleep 5
          done
          exit 1

      - name: Summary
        run: |
          {
            echo "### 🚀 Production deploy"
            echo "- Ref: ${{ github.ref }}"
            echo "- API: ${{ steps.outputs.outputs.api_url }}"
            echo "- Web: ${{ steps.outputs.outputs.web_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
